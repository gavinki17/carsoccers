<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Rocket League Web Remake (Basic 3D)</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
        #ui {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            color: white;
        }
        #instructions {
            position: absolute;
            top: 20px; left: 20px;
            background: rgba(0,0,0,0.6);
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.5;
            pointer-events: auto;
        }
        #score {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(0,0,0,0.6);
            padding: 10px 25px;
            border-radius: 10px;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 0 0 10px #000;
            pointer-events: auto;
        }
        #goalText {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            font-weight: bold;
            color: #ff0;
            text-shadow: 0 0 20px #f00;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }
        canvas { display: block; }
    </style>
    <!-- Three.js from CDN (stable r134 - works perfectly for this) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
</head>
<body>
<div id="ui">
    <div id="instructions">
        <strong>ROCKET LEAGUE WEB REMAKE</strong><br>
        WASD — Drive / Reverse<br>
        A / D — Steer<br>
        SPACE — Jump<br>
        SHIFT — Boost<br><br>
        Hit the ball into the goals!<br>
        (Single-player practice mode)
    </div>
    <div id="score">BLUE 0 — 0 ORANGE</div>
    <div id="goalText">GOOOAL!</div>
</div>

<script>
// ====================== SETUP ======================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// Lights
const ambient = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(80, 120, 50);
sun.castShadow = true;
scene.add(sun);

// ====================== FIELD ======================
const FIELD_W = 70;
const FIELD_L = 110;
const GOAL_W = 22;

// Floor
const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(FIELD_W, FIELD_L),
    new THREE.MeshPhongMaterial({ color: 0x00bb00, shininess: 10 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Field borders (walls)
const wallMat = new THREE.MeshPhongMaterial({ color: 0x555555 });
const wallH = 6;
const wallT = 3;

// Long walls (left & right)
const leftWall = new THREE.Mesh(new THREE.BoxGeometry(wallT, wallH, FIELD_L + 10), wallMat);
leftWall.position.set(-FIELD_W/2 - wallT/2, wallH/2, 0);
scene.add(leftWall);
const rightWall = leftWall.clone();
rightWall.position.x = FIELD_W/2 + wallT/2;
scene.add(rightWall);

// Short walls with goal openings (left & right of each goal)
const shortW = (FIELD_W - GOAL_W) / 2;
const shortGeo = new THREE.BoxGeometry(shortW, wallH, wallT);
const zPlusLeft = new THREE.Mesh(shortGeo, wallMat);
zPlusLeft.position.set(-FIELD_W/2 + shortW/2, wallH/2, FIELD_L/2 + wallT/2);
scene.add(zPlusLeft);
const zPlusRight = zPlusLeft.clone();
zPlusRight.position.x = FIELD_W/2 - shortW/2;
scene.add(zPlusRight);
const zMinusLeft = zPlusLeft.clone();
zMinusLeft.position.z = -FIELD_L/2 - wallT/2;
scene.add(zMinusLeft);
const zMinusRight = zPlusRight.clone();
zMinusRight.position.z = -FIELD_L/2 - wallT/2;
scene.add(zMinusRight);

// Goal structures
function createGoal(z, color) {
    const postMat = new THREE.MeshPhongMaterial({ color: 0xffffff });
    // Posts
    const leftPost = new THREE.Mesh(new THREE.BoxGeometry(1.5, 10, 1.5), postMat);
    leftPost.position.set(-GOAL_W/2, 5, z);
    scene.add(leftPost);
    const rightPost = leftPost.clone();
    rightPost.position.x = GOAL_W/2;
    scene.add(rightPost);
    // Crossbar
    const cross = new THREE.Mesh(new THREE.BoxGeometry(GOAL_W + 3, 1.5, 1.5), postMat);
    cross.position.set(0, 10, z);
    scene.add(cross);
    // Net (semi-transparent)
    const netMat = new THREE.MeshPhongMaterial({ color: color, transparent: true, opacity: 0.25, side: THREE.DoubleSide });
    const net = new THREE.Mesh(new THREE.PlaneGeometry(GOAL_W, 10), netMat);
    net.position.set(0, 5, z + (z > 0 ? 2 : -2));
    net.rotation.y = z > 0 ? Math.PI : 0;
    scene.add(net);
}
createGoal(FIELD_L/2, 0xff8800);   // Orange goal
createGoal(-FIELD_L/2, 0x4488ff);  // Blue goal

// Center line
const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff });
const points = [new THREE.Vector3(0, 0.2, -FIELD_L/2), new THREE.Vector3(0, 0.2, FIELD_L/2)];
const centerLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), lineMat);
scene.add(centerLine);

// ====================== CAR ======================
let car = {
    group: new THREE.Group(),
    velocity: new THREE.Vector3(),
    vy: 0,
    onGround: true
};

const carBody = new THREE.Mesh(
    new THREE.BoxGeometry(8, 4, 12),
    new THREE.MeshPhongMaterial({ color: 0xff2222, shininess: 30 })
);
carBody.castShadow = true;
carBody.position.y = 2.5;
car.group.add(carBody);

// Wheels
const wheelGeo = new THREE.CylinderGeometry(2.2, 2.2, 2, 32);
const wheelMat = new THREE.MeshPhongMaterial({ color: 0x111111 });
const wheelPositions = [[-4, -3.5], [4, -3.5], [-4, 3.5], [4, 3.5]];
const wheels = [];
wheelPositions.forEach(p => {
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.rotation.z = Math.PI / 2;
    w.position.set(p[0], 2, p[1]);
    car.group.add(w);
    wheels.push(w);
});

car.group.position.y = 2;
scene.add(car.group);

// ====================== BALL ======================
const BALL_RADIUS = 3.2;
const ball = new THREE.Mesh(
    new THREE.SphereGeometry(BALL_RADIUS, 32, 32),
    new THREE.MeshPhongMaterial({ color: 0xeeeeee, shininess: 50 })
);
ball.castShadow = true;
ball.receiveShadow = true;
ball.position.set(0, BALL_RADIUS, 10);
scene.add(ball);
let ballVelocity = new THREE.Vector3();

// ====================== CONTROLS ======================
const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// ====================== SCORE ======================
let scoreBlue = 0;
let scoreOrange = 0;
const scoreEl = document.getElementById('score');
const goalText = document.getElementById('goalText');

function updateScore() {
    scoreEl.textContent = `BLUE ${scoreBlue} — ${scoreOrange} ORANGE`;
}

function showGoal(text) {
    goalText.textContent = text;
    goalText.style.opacity = 1;
    setTimeout(() => goalText.style.opacity = 0, 1500);
}

// ====================== RESET ======================
function resetPositions() {
    car.group.position.set(0, 2, 0);
    car.group.rotation.y = 0;
    car.velocity.set(0, 0, 0);
    car.vy = 0;
    car.onGround = true;

    ball.position.set(0, BALL_RADIUS, 0);
    ballVelocity.set(0, 0, 0);
}

// ====================== GAME LOOP ======================
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const delta = Math.min(clock.getDelta(), 0.1); // cap delta

    // --- CAR PHYSICS ---
    const carSpeed = car.velocity.length();
    const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), car.group.rotation.y);

    const accel = 55;
    const boost = keys['shift'] ? 1.8 : 1;

    if (keys['w']) car.velocity.addScaledVector(forward, accel * boost * delta);
    if (keys['s']) car.velocity.addScaledVector(forward, -accel * 0.6 * delta);

    // Steering (more responsive at low speed)
    const turnRate = 2.8 * (1 + (30 - carSpeed) / 60);
    if (keys['a'] && carSpeed > 1) car.group.rotation.y += turnRate * delta;
    if (keys['d'] && carSpeed > 1) car.group.rotation.y -= turnRate * delta;

    // Friction & speed limit
    car.velocity.multiplyScalar(0.94);
    if (car.velocity.length() > 65) car.velocity.normalize().multiplyScalar(65);

    // Move car
    car.group.position.addScaledVector(car.velocity, delta);

    // Jump
    if (keys[' '] && car.onGround) {
        car.vy = 28;
        car.onGround = false;
    }
    car.vy -= 65 * delta; // gravity
    car.group.position.y += car.vy * delta;

    // Car ground collision
    if (car.group.position.y < 2) {
        car.group.position.y = 2;
        car.vy = 0;
        car.onGround = true;
    }

    // --- BALL PHYSICS ---
    ballVelocity.y -= 45 * delta;
    ball.position.addScaledVector(ballVelocity, delta);

    // Ball ground bounce
    if (ball.position.y < BALL_RADIUS) {
        ball.position.y = BALL_RADIUS;
        ballVelocity.y = -ballVelocity.y * 0.68;
        ballVelocity.x *= 0.97;
        ballVelocity.z *= 0.97;
        if (Math.abs(ballVelocity.y) < 1) ballVelocity.y = 0;
    }

    // Wall collisions (ball)
    const bounce = 0.82;
    if (ball.position.x < -FIELD_W/2 + BALL_RADIUS) {
        ball.position.x = -FIELD_W/2 + BALL_RADIUS;
        ballVelocity.x = -ballVelocity.x * bounce;
    }
    if (ball.position.x > FIELD_W/2 - BALL_RADIUS) {
        ball.position.x = FIELD_W/2 - BALL_RADIUS;
        ballVelocity.x = -ballVelocity.x * bounce;
    }

    // End walls / goals (ball)
    if (ball.position.z > FIELD_L/2 - BALL_RADIUS) {
        if (Math.abs(ball.position.x) < GOAL_W/2) {
            scoreOrange++;
            updateScore();
            showGoal("ORANGE GOAL!");
            resetPositions();
        } else {
            ball.position.z = FIELD_L/2 - BALL_RADIUS;
            ballVelocity.z = -ballVelocity.z * bounce;
        }
    }
    if (ball.position.z < -FIELD_L/2 + BALL_RADIUS) {
        if (Math.abs(ball.position.x) < GOAL_W/2) {
            scoreBlue++;
            updateScore();
            showGoal("BLUE GOAL!");
            resetPositions();
        } else {
            ball.position.z = -FIELD_L/2 + BALL_RADIUS;
            ballVelocity.z = -ballVelocity.z * bounce;
        }
    }

    // Car wall collisions (simple)
    if (car.group.position.x < -FIELD_W/2 + 5) { car.group.position.x = -FIELD_W/2 + 5; car.velocity.x *= -0.6; }
    if (car.group.position.x > FIELD_W/2 - 5) { car.group.position.x = FIELD_W/2 - 5; car.velocity.x *= -0.6; }
    if (car.group.position.z > FIELD_L/2 - 5 && Math.abs(car.group.position.x) > GOAL_W/2) {
        car.group.position.z = FIELD_L/2 - 5; car.velocity.z *= -0.6;
    }
    if (car.group.position.z < -FIELD_L/2 + 5 && Math.abs(car.group.position.x) > GOAL_W/2) {
        car.group.position.z = -FIELD_L/2 + 5; car.velocity.z *= -0.6;
    }

    // --- CAR <-> BALL COLLISION ---
    const dx = ball.position.x - car.group.position.x;
    const dy = ball.position.y - car.group.position.y;
    const dz = ball.position.z - car.group.position.z;
    const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
    if (dist < BALL_RADIUS + 6.5 && dist > 0.01) {
        const normal = new THREE.Vector3(dx, dy, dz).normalize();
        const overlap = (BALL_RADIUS + 6.5) - dist;
        ball.position.addScaledVector(normal, overlap * 0.6);
        car.group.position.subScaledVector(normal, overlap * 0.3);

        // Transfer momentum (car is heavy)
        const dot = ballVelocity.dot(normal);
        ballVelocity.subScaledVector(normal, 2 * dot);
        ballVelocity.addScaledVector(car.velocity, 1.9);
    }

    // --- CAMERA (third-person follow) ---
    const camDist = 45;
    const camHeight = 28;
    const idealOffset = new THREE.Vector3(0, camHeight, camDist);
    idealOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), car.group.rotation.y);
    camera.position.copy(car.group.position).add(idealOffset);
    camera.lookAt(car.group.position.x, car.group.position.y + 6, car.group.position.z);

    renderer.render(scene, camera);
}

// ====================== START ======================
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

updateScore();
resetPositions();
animate();
</script>
</body>
</html>
